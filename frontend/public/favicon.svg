<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d1fe6"/>
      <stop offset="1" stop-color="#4a0f9c"/>
    </linearGradient>
    <radialGradient id="body" cx="38%" cy="30%" r="90%">
      <stop offset="0" stop-color="#b06bff"/>
      <stop offset="55%" stop-color="#7c1fe0"/>
      <stop offset="100%" stop-color="#4b0f9e"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9dfff"/>
    </radialGradient>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#body)" opacity="0.9"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="150" cy="110" r="4" opacity="0.5"/>
      <circle cx="300" cy="90" r="5" opacity="0.4"/>
      <circle cx="410" cy="220" r="4" opacity="0.5"/>
      <circle cx="360" cy="330" r="5" opacity="0.5"/>
      <circle cx="230" cy="220" r="4" opacity="0.4"/>
      <circle cx="130" cy="330" r="4" opacity="0.4"/>
      <circle cx="440" cy="400" r="5" opacity="0.45"/>
      <circle cx="200" cy="420" r="4" opacity="0.4"/>
      <circle cx="90" cy="180" r="4" opacity="0.4"/>
      <circle cx="470" cy="140" r="4" opacity="0.4"/>
    </g>

    <!-- orbit ring stripes -->
    <g stroke="#c77bff" fill="none" stroke-linecap="round">
      <path d="M120 70 C 240 120, 330 190, 500 360" stroke-width="26" opacity="0.85"/>
      <path d="M40 220 C 170 290, 250 360, 400 520" stroke-width="30"/>
      <path d="M400 250 C 445 300, 480 360, 512 440" stroke-width="26" opacity="0.8"/>
    </g>

    <!-- pink/orange crescent planet, bottom-left -->
    <circle cx="50" cy="470" r="185" fill="url(#hot)"/>
    <!-- white moon -->
    <circle cx="378" cy="165" r="70" fill="url(#moon)"/>
  </g>
</svg>
