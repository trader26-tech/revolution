<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Revolution app icon — deliberately just THREE elements:
      1. the sun, anchored in the bottom-left corner
      2. one orbit ring sweeping around it
      3. one silver moon riding that ring

    Everything is built around a single focal point (the sun's centre at
    88,424) so the composition reads instantly at 40px on a home screen.
    The ring is drawn as an ARC, not a full circle: it enters and leaves the
    canvas edges, which implies a much larger orbit than the tile can hold and
    keeps the icon from looking like a flat target symbol.
  -->
  <defs>
    <!-- deep-space tile, matching the app's background tones -->
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1a0b3f"/>
      <stop offset="0.55" stop-color="#0d0426"/>
      <stop offset="1" stop-color="#06010f"/>
    </linearGradient>

    <!-- the sun: hot core -> warm rim, lit from its upper-left -->
    <radialGradient id="sun" cx="34%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffd77f"/>
      <stop offset="0.34" stop-color="#ffab3f"/>
      <stop offset="0.68" stop-color="#ff6a45"/>
      <stop offset="1" stop-color="#ff2f6d"/>
    </radialGradient>

    <!-- the corona bleeding into the sky -->
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a3c" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#ff3d78" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff2d78" stop-opacity="0"/>
    </radialGradient>

    <!-- silver moon, lit from the sun (i.e. from its lower-left) -->
    <radialGradient id="moon" cx="34%" cy="66%" r="82%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#dfe3f0"/>
      <stop offset="0.78" stop-color="#a8adc2"/>
      <stop offset="1" stop-color="#6c7288"/>
    </radialGradient>

    <!-- the ring fades at both ends so it melts into space instead of
         stopping abruptly at the tile edge -->
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a8ff" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#d9bcff" stop-opacity="0.95"/>
      <stop offset="0.72" stop-color="#b98cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8a5cf0" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- 2. THE ORBIT — one clean arc around the sun's centre.
         r=250 about (88,424); it exits the top edge and the right edge. -->
    <circle
      cx="88" cy="424" r="250"
      fill="none"
      stroke="url(#ring)"
      stroke-width="13"
      stroke-linecap="round"
    />

    <!-- 1. THE SUN — corona first, then the body, anchored bottom-left -->
    <circle cx="88" cy="424" r="270" fill="url(#corona)"/>
    <circle cx="88" cy="424" r="132" fill="url(#sun)"/>
    <!-- a bright rim keeps the sun crisp against its own glow -->
    <circle cx="88" cy="424" r="132" fill="none" stroke="#ffd9a8" stroke-width="2.5" opacity="0.5"/>

    <!-- 3. THE MOON — sitting ON the ring, up and to the right so it sits in
         the icon's open space and balances the sun's mass. -->
    <!-- contact shadow, offset away from the sun -->
    <circle cx="267" cy="242" r="58" fill="#05010d" opacity="0.45"/>
    <circle cx="263" cy="246" r="58" fill="url(#moon)"/>
    <circle cx="263" cy="246" r="57" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.22"/>
  </g>
</svg>
