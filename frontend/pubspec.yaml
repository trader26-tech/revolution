name: revolution
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+3

environment:
  # Was ^3.13.0-282.1.beta — the beta SDK `flutter create` happened to be run
  # on. Nothing here uses 3.13 features, and that pin made the project
  # unbuildable on Flutter stable. This range is strictly wider, so it still
  # accepts 3.13+.
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # On-device persistence for user-added options (lists, categories, payment
  # methods). Swappable for a DB-backed repo later — see OptionsStore.
  shared_preferences: ^2.3.0

  # Fetching brand/app logos by domain (Clearbit-style) for the icon picker.
  http: ^1.2.0
  # MediaType for multipart document uploads (transitive via http; pinned direct
  # so the import is explicit).
  http_parser: ^4.0.0
  flutter_sticky_header: ^0.8.0
  url_launcher: ^6.3.2
  # Pinned to 8.x deliberately. 10.x's android/build.gradle.kts uses the
  # `kotlin { }` extension, which needs android.builtInKotlin=true — but
  # shared_preferences_android still applies kotlin-android explicitly, which
  # that same flag forbids under AGP 9. The two cannot both be satisfied, so
  # the Android build fails whichever way the flag is set. 8.x uses the older
  # Groovy script and works alongside the rest. Same PackageInfo API.
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Firebase — phone (OTP) authentication. firebase_core boots the SDK from the
  # generated firebase_options.dart; firebase_auth drives the verify-phone /
  # confirm-code flow. See features/auth/data/phone_auth_service.dart.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Pick a policy document (PDF or photo) to attach to an insurance item. The
  # signed URL to VIEW it is opened with url_launcher (native PDF/image viewer),
  # so no heavy in-app PDF renderer is needed.
  file_picker: ^8.1.2

  # Native share sheet — used to share a document from the Documents library
  # (share, save to Files, send on WhatsApp, …).
  share_plus: ^10.0.0

  # App documents directory — where locally-kept documents are COPIED so they
  # survive even if the original is moved/deleted. Nothing leaves the device.
  path_provider: ^2.1.4

  # Open a LOCAL document file in the phone's native viewer (fallback only —
  # documents are viewed IN-APP; this is used if the in-app viewer can't render
  # a format).
  open_filex: ^4.5.0

  # Render PDF pages to images entirely IN-APP (pure-Flutter, iOS+Android), so a
  # document opens inside the app instead of bouncing to an external viewer.
  # Also powers the first-page thumbnail on PDF rows.
  pdfx: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the Android + iOS launcher icons from tool/revo_icon.png (Revo,
  # rendered from the in-app Mascot). Regenerate with:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# App launcher icon — Revo the mascot on the dark-purple app background.
flutter_launcher_icons:
  image_path: "tool/revo_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true # iOS icons must be opaque; our bg is already solid
  # Android 8+ uses the ADAPTIVE icon (a separate foreground + background). Set
  # both so the home-screen icon actually updates — without these the adaptive
  # foreground stays stale and the old icon keeps showing even after regen. The
  # foreground is Revo already composed on the dark bg, so the background colour
  # just fills the mask edges to match.
  adaptive_icon_background: "#100B20" # AppColors.bg — matches the app sky
  adaptive_icon_foreground: "tool/revo_icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
