<main class="shell">
  <header>
    <h1>{{ title }}</h1>
    <p class="tagline">Angular PWA &middot; FastAPI &middot; Supabase</p>
  </header>

  <section class="card">
    <h2>Supabase connectivity</h2>
    <p *ngIf="!configured" class="hint">
      Fill in <code>supabaseUrl</code> and <code>supabaseKey</code> in
      <code>src/environments/environment.ts</code> to connect.
    </p>

    <button (click)="loadItems()" [disabled]="loading()">
      {{ loading() ? 'Loading…' : 'Load items from Supabase' }}
    </button>

    <p *ngIf="error()" class="error">{{ error() }}</p>

    <ul *ngIf="items().length">
      <li *ngFor="let item of items()">{{ item | json }}</li>
    </ul>
  </section>
</main>
